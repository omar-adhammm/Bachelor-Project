paths:
  data: "data/raw/official"
  raw_data: "data/raw/official"
  cf_pairs: "outputs/cf_pairs_official"
  checkpoints: "outputs/model_checkpoints"
  results: "outputs/results"

labels:
  id2label:
    0: "normal"
    1: "offensive"
    2: "hatespeech"
  label2id:
    normal: 0
    offensive: 1
    hatespeech: 2
  harmful:
    - "offensive"
    - "hatespeech"

models:
  bert:
    name: "bert-base-uncased"
    max_length: 128
    batch_size: 32
    learning_rate: 2e-5
    epochs: 10
    warmup_steps: 200

  hatebert:
    name: "vinai/bertweet-base"
    max_length: 128
    batch_size: 32
    learning_rate: 2e-5
    epochs: 35
    warmup_steps: 400

  proposed:
    name: "vinai/bertweet-base"
    max_length: 128
    batch_size: 32
    learning_rate: 2e-5
    epochs: 50
    warmup_steps: 400
    contrastive_weight: 0.3
    contrastive_temperature: 0.07
    rationale_weight: 0.1

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - "query"
    - "value"

counterfactual:
  max_retries: 3
  acceptance_threshold: 0.5
  strategy: "zero_shot"

api:
  temperature: 0.3
  max_tokens: 128
