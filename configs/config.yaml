paths:
  data: "data/raw/official"
  cf_pairs: "outputs/cf_pairs_official"
  checkpoints: "outputs/model_checkpoints"
  results: "outputs/results"

labels:
  id2label:
    0: "normal"
    1: "offensive"
    2: "hatespeech"
  label2id:
    normal: 0
    offensive: 1
    hatespeech: 2

models:
  hatebert:
    name: "vinai/bertweet-base"
    max_length: 128
    batch_size: 32
    learning_rate: 2e-5
    epochs: 35
    warmup_steps: 400

  proposed:
    name: "vinai/bertweet-base"
    max_length: 128
    batch_size: 32
    learning_rate: 2e-5
    epochs: 35
    warmup_steps: 400
    contrastive_weight: 0.3
    contrastive_temperature: 0.07
    rationale_weight: 0.2

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  target_modules:
    - "query"
    - "value"